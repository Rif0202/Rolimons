<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Limited Trade</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#202124;color:#eee;font-family:Arial,Helvetica,sans-serif}
.page{width:100%;max-width:1294px;margin:0 auto;min-height:100vh;background:#242629}
.top{height:162px;background:#202124;display:flex;align-items:center;padding:18px 4.1%;gap:30px}
.avatar{width:138px;height:138px;object-fit:cover;object-position:center;background:#111;flex:nonetransform:translateX(-5px)}
.identity{flex:1;min-width:0}
.username{font-size:40px;line-height:1.1;color:#eee;white-space:nowrap}
.last-seen{font-size:34px;color:#74777d;margin-top:17px;white-space:nowrap}
.actions{display:flex;gap:28px;align-items:center}
.action{border:0;border-radius:60px;background:#087fca;color:#fff;padding:18px 30px;font-size:44px;line-height:1.25;white-space:nowrap;text-decoration:none;display:inline-block}
.action.details{cursor:default}
.action.send:hover{background:#078ee0}
.content{padding:45px 7.5% 65px}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:10%}
h2{font-size:52px;line-height:1.15;text-align:center;margin:0 0 46px;font-weight:700}
.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.item{aspect-ratio:1;background:#2a2d31;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.item img{width:88%;height:88%;object-fit:contain;image-rendering:auto}
.stats{margin-top:22px;text-align:center;font-size:40px;line-height:1.95;color:#aeb0b4}
.statline{display:flex;justify-content:center;align-items:center;gap:20px;white-space:nowrap}
.value{color:#61c5e4;font-weight:700}
.rap{color:#69c878;font-weight:700}
.robux{display:flex;align-items:center;justify-content:center;gap:24px;color:#eee;font-weight:700;margin-top:14px}
.robux-icon{width:48px;height:48px;border:4px solid #eee;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;transform:rotate(30deg);position:relative}
.robux-icon:after{content:"";width:15px;height:15px;background:#eee;display:block;transform:rotate(-30deg);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
@media(max-width:760px){
 .top{height:auto;min-height:100px;padding:12px 3%;gap:12px}
 .avatar{width:68px;height:68px}
 .username{font-size:clamp(19px,5vw,28px)}
 .last-seen{font-size:clamp(14px,4vw,21px);margin-top:7px}
 .actions{gap:8px}
 .action{font-size:clamp(13px,3.8vw,19px);padding:11px 13px}
 .content{padding:30px 4% 45px}
 .columns{gap:4%}
 h2{font-size:clamp(23px,5.8vw,34px);margin-bottom:24px}
 .item-grid{gap:9px}
 .item{border-radius:9px}
 .stats{font-size:clamp(16px,4vw,23px);line-height:1.9;margin-top:15px}
 .statline{gap:9px}
 .robux{gap:13px;margin-top:8px}
 .robux-icon{width:29px;height:29px;border-width:3px;border-radius:8px}
 .robux-icon:after{width:9px;height:9px}
}
@media(max-width:390px){
 .avatar{width:54px;height:60px}
 .top{gap:8px}
 .actions{gap:5px}
 .action{padding:9px 10px}
 .content{padding-left:3%;padding-right:3%}
}

/* Tighten spacing between the two trade requests */
.page + .page { margin-top: -110px; }
</style>
</head>
